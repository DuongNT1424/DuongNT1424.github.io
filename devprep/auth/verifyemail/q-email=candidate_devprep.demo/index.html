<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">
<head><script src="/assets/vendor/cursor-swarm.min.js"></script><script src="/assets/vendor/demo-swarm.js" data-demo="devprep" data-names="CANDIDATE,ADMIN,AI" data-colors="#8b5cf6,#22d3ee,#a3e635" data-skip="/interview/room/" data-ignore="#dp-demo-bar, #dp-demo-toast, #devprep-ann-overlay"></script><script>window.__DP={root:"/devprep",role:"guest",page:"/Auth/VerifyEmail?email=candidate@devprep.demo"};</script><script src="/devprep/demo/devprep-data.js"></script><script src="/devprep/demo/devprep-shim.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email | DevPrep AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <link rel="stylesheet" href="/devprep/css/auth.css?v=jWfXputhMe2C7VdaaZgtALaG5_lvcnzXrkG8NzFwxBw" />
</head>
<body class="auth-page">
    <div class="ambient-blob blob-purple"></div>
    <div class="ambient-blob blob-cyan"></div>

    <main class="d-flex flex-column align-items-center justify-content-center min-vh-100 p-3 w-100">
        <div class="glass-card rounded-4 p-4 p-md-5 d-flex flex-column align-items-center text-center" style="max-width: 420px;">
            <div class="icon-circle rounded-circle d-flex align-items-center justify-content-center mb-4">
                <span class="material-symbols-outlined fs-1">mail</span>
            </div>

            <h1 class="h3 fw-bold mb-2">Verify Email</h1>
            <p class="text-surface-variant small mb-4" style="max-width: 260px;">
                We sent a 6-digit code to <strong>candidate@devprep.demo</strong>. It expires in 30 minutes.
            </p>


            <!-- Verify form -->
            <form method="post" id="verifyForm" class="w-100" action="/devprep/auth/verifyemail/">
                <input type="hidden" data-val="true" data-val-required="The Email field is required." id="Email" name="Email" value="candidate@devprep.demo" />
                <input type="hidden" id="otp-value" data-val="true" data-val-regex="The verification code must be 6 digits." data-val-regex-pattern="^\d{6}$" data-val-required="Please enter the 6-digit code." name="Otp" value="" />

                <div class="d-flex gap-2 mb-2 justify-content-center" id="otp-inputs">
                    <input autocomplete="one-time-code" class="otp-input" maxlength="1" inputmode="numeric" pattern="\d*" type="text">
                    <input class="otp-input" maxlength="1" inputmode="numeric" pattern="\d*" type="text">
                    <input class="otp-input" maxlength="1" inputmode="numeric" pattern="\d*" type="text">
                    <input class="otp-input" maxlength="1" inputmode="numeric" pattern="\d*" type="text">
                    <input class="otp-input" maxlength="1" inputmode="numeric" pattern="\d*" type="text">
                    <input class="otp-input" maxlength="1" inputmode="numeric" pattern="\d*" type="text">
                </div>
                <span class="auth-field-error d-block text-center mb-3 field-validation-valid" data-valmsg-for="Otp" data-valmsg-replace="true"></span>

                <button class="primary-btn w-100 py-3 fw-bold mb-4" type="submit">Verify Email</button>
            <input name="__RequestVerificationToken" type="hidden" value="CfDJ8KAizZJiQMJBvce500EFVmZ-A-wqPSrC807kXigqQsy2ZxZSu2R73VUAelIYRwhgdouO6jFG8LB5O-uRtB0awDzOHDnEJZeG8dKP4nQcY82r0cT54zaHvKGOqge-ZrA9pSDBcP-yV_7545nykbcaVX8" /></form>

            <!-- Resend -->
            <div class="d-flex align-items-center gap-2">
                <span class="text-surface-variant small">Didn't receive it?</span>
                <form method="post" class="m-0" action="/devprep/auth/resendotp/">
                    <input type="hidden" name="email" value="candidate@devprep.demo" />
                    <button type="submit" class="resend-btn" id="resend-timer">Resend Code</button>
                <input name="__RequestVerificationToken" type="hidden" value="CfDJ8KAizZJiQMJBvce500EFVmZ-A-wqPSrC807kXigqQsy2ZxZSu2R73VUAelIYRwhgdouO6jFG8LB5O-uRtB0awDzOHDnEJZeG8dKP4nQcY82r0cT54zaHvKGOqge-ZrA9pSDBcP-yV_7545nykbcaVX8" /></form>
            </div>

            <div class="w-100 d-flex justify-content-center" style="border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 32px; padding-top: 32px;">
                <a class="back-link text-decoration-none d-flex align-items-center justify-content-center gap-2" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 16px; letter-spacing: 0.05em; font-weight: 500;" href="/devprep/auth/login/">
                    <span class="material-symbols-outlined" style="font-size: 14px;">arrow_back</span>BACK TO LOGIN
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        const inputs = document.querySelectorAll('#otp-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.key >= '0' && e.key <= '9') {
                    if (index < inputs.length - 1) inputs[index + 1].focus();
                } else if (e.key === 'Backspace') {
                    if (index > 0) inputs[index - 1].focus();
                }
            });
            input.addEventListener('input', () => { input.value = input.value.replace(/[^0-9]/g, ''); });
        });

        // Gộp 6 ô thành 1 chuỗi OTP vào hidden field trước khi submit.
        document.getElementById('verifyForm').addEventListener('submit', () => {
            document.getElementById('otp-value').value =
                Array.from(inputs).map(i => i.value).join('');
        });

        // Đếm giờ: khoá nút Resend 45s rồi mở lại.
        let timeLeft = 45;
        const resendBtn = document.getElementById('resend-timer');
        function tick() {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                resendBtn.textContent = 'Resend Code';
                resendBtn.disabled = false;
                return;
            }
            resendBtn.textContent = `Resend in ${timeLeft}s`;
            resendBtn.disabled = true;
            timeLeft--;
        }
        tick();
        const countdown = setInterval(tick, 1000);
    </script>
</body>
</html>
