<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<script>
(function () {
  var p = location.pathname, ROUTES = /^\/(home|auth|interview|evaluation|profile|payment|news|feedback|cvjd|verification|admin|manager)(\/|$)/i;
  if (p.indexOf("/devprep/") !== 0 && !ROUTES.test(p)) return;
  var s = document.createElement("script"); s.src = "/devprep/demo/devprep-data.js";
  s.onload = function () {
    var D = window.__DPDATA || { pages: [] }, pages = {}; D.pages.forEach(function (x) { pages[x] = 1; });
    var k = p.replace(/^\/devprep(?=\/)/, "").replace(/\/index\.html$/, "").replace(/\/+$/, "").toLowerCase();
    if (D.aliases && D.aliases[k]) k = D.aliases[k];
    while (k && !pages[k]) k = k.replace(/\/[^\/]*$/, "");
    location.replace("/devprep" + (k || "") + "/");
  };
  document.head.appendChild(s);
})();
</script>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#1d2935}a{color:#14304a}</style>
</head>
<body>
<h1>Page not found</h1>
<p>This page doesn't exist. <a href="/">Go to the portfolio</a>.</p>
</body>
</html>
