            <div class="mb-6">

                    ← Back to List
                </a>
                <h1 class="text-2xl font-bold text-gray-800 mt-2">Edit Supplier</h1>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-8">
                <form action="/admin/suppliers/save" method="post" class="space-y-6">
                    <input type="hidden" id="id" name="id" value="2" />

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Supplier Name</label>
                        <input type="text" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none"
                               placeholder="e.g. Thien Long Group" id="supplierName" name="supplierName" value="Nh&agrave; s&aacute;ch Tri Thức Việt">
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                            <input type="text" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none"
                                   placeholder="e.g. 028 3750 5555" id="phone" name="phone" value="02437654321">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Address</label>
                        <textarea rows="3"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none"
                                  placeholder="Enter supplier address..." id="address" name="address">175 Giảng V&otilde;, Đống Đa, H&agrave; Nội</textarea>
                    </div>

                    <div class="pt-4 border-t flex justify-end gap-3">
                        <a href="../../index.html" class="px-6 py-2 rounded-lg border hover:bg-gray-50 transition">Cancel</a>
                        <button type="submit" class="px-6 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition">
                            Save Supplier
                        </button>
                    </div>
                </form>
            </div>
