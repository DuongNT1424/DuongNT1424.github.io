    <main class="ml-64 p-8">
        <div class="max-w-5xl mx-auto">

            </div>

            <div class="bg-white rounded-xl shadow-sm p-8">
                <form action="/admin/imports/save" method="post" id="importForm" class="space-y-6" onsubmit="return validateForm()">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Select Supplier</label>
                        <select name="supplierId" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                            <option value="">-- Choose Supplier --</option>
                            <option value="1">Công ty Phát hành sách Phương Nam</option>
                            <option value="2">Nhà sách Tri Thức Việt</option>
                        </select>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <label class="block text-sm font-semibold text-gray-700">Product Details</label>
                        </div>
                        
                        <div id="product-list" class="space-y-4">
                            <div class="grid grid-cols-12 gap-4 px-4 text-xs font-bold text-gray-400 uppercase">
                                <div class="col-span-4">Product</div>
                                <div class="col-span-2">Quantity</div>
                                <div class="col-span-3">Unit Price</div>
                                <div class="col-span-2 text-right">Subtotal</div>
                                <div class="col-span-1"></div>
                            </div>

                            <div class="product-item grid grid-cols-12 gap-4 items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                                <div class="col-span-4">
                                    <select name="productIds" required class="w-full px-3 py-2 border rounded focus:ring-1 focus:ring-orange-500 text-sm">
                                        <option value="">-- Select Product --</option>
                                        <option value="1">Mùa Hạ Bên Sông (Stock: 45)</option>
                                        <option value="2">Thành Phố Không Ngủ (Stock: 32)</option>
                                        <option value="4">Tư Duy Tài Chính Cá Nhân (Stock: 58)</option>
                                        <option value="5">Khởi Nghiệp Từ Con Số 0 (Stock: 27)</option>
                                        <option value="6">Quản Trị Thời Gian (Stock: 40)</option>
                                        <option value="7">Sống Chậm Giữa Đời Vội (Stock: 63)</option>
                                        <option value="8">Nghệ Thuật Lắng Nghe (Stock: 21)</option>
                                        <option value="9">Chú Mèo Đi Tìm Mặt Trăng (Stock: 80)</option>
                                        <option value="10">Phiêu Lưu Đảo Xanh (Stock: 74)</option>
                                        <option value="11">Lập Trình Java Thực Chiến (Stock: 18)</option>
                                        <option value="12">Nhập Môn Trí Tuệ Nhân Tạo (Stock: 25)</option>
                                        <option value="13">Bút bi xanh hộp 3 cây (Stock: 93)</option>
                                        <option value="14">Bút dạ quang 5 màu (Stock: 86)</option>
                                        <option value="15">Sổ tay A5 bìa vải (Stock: 79)</option>
                                        <option value="16">Sổ lò xo 200 trang (Stock: 72)</option>
                                        <option value="17">Thước kẻ nhôm 30cm (Stock: 65)</option>
                                        <option value="18">Hộp bút vải canvas (Stock: 58)</option>
                                    </select>
                                </div>
                                <div class="col-span-2">
                                    <input type="number" name="quantities" min="1" step="1" required placeholder="Qty"

                                </div>
                                <div class="col-span-3">

                                           class="price-input w-full px-3 py-2 border rounded text-sm focus:ring-1 focus:ring-orange-500">
                                </div>
                                <div class="col-span-2 text-right font-bold text-gray-700">
                                    <span class="subtotal-display">0</span> đ
                                </div>
                                <div class="col-span-1 text-center">
                                    <button type="button" onclick="removeRow(this)" class="text-red-400 hover:text-red-600 transition">

                            Create Import Request

    <script>
        const MAX_TOTAL = 1000000000; 

        function addProductRow() {
            const firstRow = document.querySelector('.product-item');
            const newRow = firstRow.cloneNode(true);
            newRow.querySelectorAll('input').forEach(i => i.value = ''); 
            newRow.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
            newRow.querySelector('.subtotal-display').innerText = '0';
            document.getElementById('product-list').appendChild(newRow);
            attachEvents();
        }

        function removeRow(btn) {
            const rows = document.querySelectorAll('.product-item');
            if (rows.length > 1) {
                btn.closest('.product-item').remove();
                calculateTotal();
            } else {
                alert("At least one product is required.");
            }
        }

        function calculateTotal() {
            let grandTotal = 0;
            document.querySelectorAll('.product-item').forEach(row => {
                let qtyInput = row.querySelector('.qty-input');
                let priceInput = row.querySelector('.price-input');
                
                let rawQty = qtyInput.value;
                let rawPrice = priceInput.value;

                if (rawQty !== "" && parseFloat(rawQty) < 1) {
                    qtyInput.value = 1;
                    rawQty = "1";
                }
                if (rawPrice !== "" && parseFloat(rawPrice) < 0) {
                    priceInput.value = 0;
                    rawPrice = "0";
                }

                let qty = parseFloat(rawQty) || 0;
                let price = parseFloat(rawPrice) || 0;

                if (!Number.isInteger(qty)) {
                    qty = Math.floor(qty);
                    qtyInput.value = qty;
                }

                const subtotal = qty * price;
                row.querySelector('.subtotal-display').innerText = subtotal.toLocaleString('vi-VN');
                grandTotal += subtotal;
            });

            const totalDisplay = document.getElementById('grand-total');
            totalDisplay.innerText = grandTotal.toLocaleString('vi-VN');

            if (grandTotal > MAX_TOTAL) {
                totalDisplay.classList.remove('text-orange-600');
                totalDisplay.classList.add('text-red-600');
            } else {
                totalDisplay.classList.remove('text-red-600');
                totalDisplay.classList.add('text-orange-600');
            }
        }

        function validateForm() {
            let grandTotal = 0;
            let isValid = true;
            let rows = document.querySelectorAll('.product-item');

            for (let i = 0; i < rows.length; i++) {
                let row = rows[i];
                const productSelect = row.querySelector('select');
                const qtyVal = row.querySelector('.qty-input').value;
                const priceVal = row.querySelector('.price-input').value;

                if (!productSelect.value) {
                    alert("Please select a product for row " + (i + 1));
                    isValid = false; break;
                }

                const qty = parseInt(qtyVal);
                const price = parseFloat(priceVal);
                
                if (isNaN(qty) || qty < 1) {
                    alert("Row " + (i + 1) + ": Quantity must be at least 1.");
                    isValid = false; break;
                }
                if (isNaN(price) || price < 1000) {
                    alert("Row " + (i + 1) + ": Unit Price must be at least 1,000 VNĐ.");
                    isValid = false; break;
                }
                grandTotal += (qty * price);
            }

            if (isValid && grandTotal > MAX_TOTAL) {
                alert("Grand Total cannot exceed 1,000,000,000 VNĐ (1 Billion). Current: " + grandTotal.toLocaleString('vi-VN') + " VNĐ");
                isValid = false;
            }

            return isValid;
        }

        function attachEvents() {
            document.querySelectorAll('.qty-input, .price-input').forEach(input => {
                input.removeEventListener('input', calculateTotal);
                input.addEventListener('input', calculateTotal);
                input.addEventListener('change', calculateTotal);
            });
        }

        attachEvents();
    </script>
